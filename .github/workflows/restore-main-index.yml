name: Restore SleepyChat Main Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-index:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Restore exact index.html
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '.bootstrap/index.html.gz.b64'
          if (-not (Test-Path $source)) { throw "Missing staged source: $source" }

          # Normalize the staged Base64 text. The original staging write lost
          # trailing padding, and GitHub/text transport can also introduce CR/LF.
          $b64 = Get-Content $source -Raw
          $b64 = [regex]::Replace($b64, '[^A-Za-z0-9+/=]', '')
          $b64 = $b64.TrimEnd('=')
          $remainder = $b64.Length % 4
          if ($remainder -eq 1) { throw "Invalid Base64 payload length: $($b64.Length)" }
          if ($remainder -gt 0) { $b64 += ('=' * (4 - $remainder)) }

          $gzBytes = [Convert]::FromBase64String($b64)
          $input = [IO.MemoryStream]::new($gzBytes)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          try {
            $gzip.CopyTo($output)
          }
          finally {
            $gzip.Dispose()
            $input.Dispose()
          }

          [IO.Directory]::CreateDirectory('CSharpHost/web') | Out-Null
          [IO.File]::WriteAllBytes('CSharpHost/web/index.html', $output.ToArray())
          $output.Dispose()

          $restored = Get-Item 'CSharpHost/web/index.html'
          if ($restored.Length -ne 59234) { throw "Restored index.html size mismatch: $($restored.Length)" }
          $html = [IO.File]::ReadAllText($restored.FullName)
          if ($html -notmatch 'SleepyChat 1\.0\.0' -or $html -notmatch '/api/twitch-badges' -or $html -notmatch '/api/kick-badge-image') {
            throw 'Restored UI validation failed.'
          }

      - name: Commit restored index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'SleepyChat Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CSharpHost/web/index.html
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Restore SleepyChat web entrypoint'
          git push origin HEAD:main
