name: Publish SleepyChat 1.0.0 from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct staged current source text
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem '.build\current-text.part*' -File | Sort-Object Name)
          if ($parts.Count -lt 1) { throw 'No staged source chunks were found.' }
          Write-Host "Using $($parts.Count) staged source chunks."
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $packed = [Convert]::FromBase64String($encoded)
          $gz = Join-Path $env:RUNNER_TEMP 'current-source.gz'
          [IO.File]::WriteAllBytes($gz, $packed)

          $inner = Join-Path $env:RUNNER_TEMP 'current-source.inner'
          $input = [IO.File]::OpenRead($gz)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($inner)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          $extract = Join-Path $env:RUNNER_TEMP 'current-source-extract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $bytes = [IO.File]::ReadAllBytes($inner)
          $isZip = $bytes.Length -ge 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B
          if ($isZip) {
            $zip = $inner + '.zip'
            Copy-Item $inner $zip -Force
            Expand-Archive -Path $zip -DestinationPath $extract -Force
          } else {
            & tar.exe -xf $inner -C $extract
            if ($LASTEXITCODE -ne 0) {
              $head = ($bytes[0..([Math]::Min(31,$bytes.Length-1))] | ForEach-Object { $_.ToString('X2') }) -join ''
              throw "Staged payload format is unsupported. First bytes: $head"
            }
          }

          $candidate = $null
          if ((Test-Path (Join-Path $extract 'README.md')) -and (Test-Path (Join-Path $extract 'CSharpHost\SleepyChat.csproj'))) {
            $candidate = $extract
          } else {
            foreach ($readme in (Get-ChildItem $extract -Recurse -Filter README.md -File)) {
              $dir = $readme.Directory.FullName
              if (Test-Path (Join-Path $dir 'CSharpHost\SleepyChat.csproj')) { $candidate = $dir; break }
            }
          }
          if (-not $candidate) { throw 'Could not locate the staged current source root.' }
          "TEXT_SOURCE_ROOT=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify all current source text hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = @(
            '.github/workflows/csharp-runtime-smoke.yml|e98e74573e40d41fa225a6bf922ddf5020fdd63a952dadbd05bb970dda1deda3',
            '.gitignore|4a81cc06c2f8a5e8d2cf18ce2b7dad97aec9134df0148e1b1f35ce7b79a46e89',
            'BUILD_INFO.txt|963d4192b9af6ba77130bb2dd244168468c2f8f7c6086f99d53a61c0e8ed17a9',
            'BUILD_RELEASE.ps1|f9c0883d2835f485eab2e22740884c3fbb02a2afd7fd4566e3f78d2dfc796354',
            'CSharpHost/App/AppUtil.cs|030563a187e8ccc0cbafba4b5c16da4e0244488aa8f559b26f233812c6f0b947',
            'CSharpHost/App/Program.cs|db79246da93e81807ae55844ac36e91d31d3b43726ef0a11f46b18a888e7f181',
            'CSharpHost/Backend/BackendHost.Media.cs|844526b5d6a2aaf507cfc3e5763043def3875dbdf254a62a4fed908a59f18d42',
            'CSharpHost/Backend/BackendHost.cs|c78dfebe1d1850b6d047f837338821c44d9060b6810c7920a6088b884036739a',
            'CSharpHost/Kick/HostedKickModels.cs|29a546c9d688e2580eae3a1d6dcbccdb6aca61137c72ad8ee7d14f7d8ef1b1e3',
            'CSharpHost/Kick/HostedKickService.Delivery.cs|2ef63dda5204bc1f312e0f5a1d81a990a3b76ecd5fdd91759434e88b400f2bdb',
            'CSharpHost/Kick/HostedKickService.Helpers.cs|258f2b4717859688be4a2220dfa4f42ab048571d98691dd868df898092fed821',
            'CSharpHost/Kick/HostedKickService.Storage.cs|91dc271f92eb7e86c287dc2f4c75b8b464f2d2cd88da5aae0d8e4abb767ceb8c',
            'CSharpHost/Kick/HostedKickService.cs|84cd7a9b42ed72ce19813f08d8bab98f0a549f0829e96bb39739e15b9c792e7c',
            'CSharpHost/SleepyChat.csproj|f72c73732de76d150eed248281be691a84dac7e0d50d3b51301e920636a6bfb5',
            'CSharpHost/Updates/UpdateService.cs|7c8b8ab893b4725e949a623ceaeea10bc48ae46d043f08cab6ca8768a847f233',
            'CSharpHost/Window/MainForm.CaptionButton.cs|c0b58c961065cbd45bd880e6407fd868bc315e4415c6b2e84e0c67f0001e3f49',
            'CSharpHost/Window/MainForm.Resize.cs|0103022d3a70e5e081b2527789a99ef19737f78aae09ab4167d7bf266ea85d01',
            'CSharpHost/Window/MainForm.WebView.cs|411fe5804eba22849ea7fd9f5714c6bb88b5dd1d0baa81aeee1f3d19d23074a8',
            'CSharpHost/Window/MainForm.Window.cs|40e35ef3884ce0f2166ba08553a38db926db6de5e6b79f2053feac083c621bed',
            'CSharpHost/Window/MainForm.cs|eb00f34c7bb8770d2e376b33583a8be4ebf591a9f2544cb260e0061e6716e22a',
            'CSharpHost/web/css/app.css|ee6e3b7b4aee650f3708e62306da396ce075df394b3bbdbd5a44024f913fba19',
            'CSharpHost/web/css/ui-polish.css|7e7c394906a103a1009e8e8433a12a0a02c68459d4ba9b682686a82feebcb051',
            'CSharpHost/web/index.html|397f8b4770ddf6f6e5ebc5901725368a66618fd216661277e32bbc73ffefbf2d',
            'CSharpHost/web/js/app.js|94dbd651a5fae7eaaa23cb1dfa7ec5a866a1027ef3c81067548feac090f8a8fd',
            'CSharpHost/web/manifest.webmanifest|5606d84a415a4701dc91ac97c144a15e4c231c01219066b813d69b8c7dac958d',
            'README.md|ab523685017478aefda4c10aa8e1597bfd58c2d3e209eec49222b6649b4f1f8f',
            'docs/ARCHITECTURE.md|2139885657f18ad0095891acbde06df4205929f04b17d74f85b2cb286c585e6e',
            'docs/CODE_AUDIT.md|78babe5a13df76fafd496e4c9196d1849268c32f570892ccbf0af4c27c818a30',
            'docs/SHARED_KICK_BACKEND.md|951ecd0a35ea6a3a34b57c28ffec44f94231416305552afd37a9fcebbbd943d3',
            'readme.txt|7da97fbc2ccea618c62b1a6919588ff78601e729a63d86937f0cb6a28ad8547b',
            'release_notes.txt|f828a76074b3a3201219ecaf3c6c5a08b7890b020b3b494f5ef13af74d1443cd'
          )
          $actualFiles = @(Get-ChildItem $env:TEXT_SOURCE_ROOT -Recurse -File)
          if ($actualFiles.Count -ne 31) { throw "Expected exactly 31 staged text files, found $($actualFiles.Count)." }
          foreach ($row in $manifest) {
            $parts = $row.Split('|', 2)
            $rel = $parts[0]
            $expected = $parts[1]
            $path = Join-Path $env:TEXT_SOURCE_ROOT ($rel -replace '/', '\')
            if (-not (Test-Path $path)) { throw "Missing staged source file: $rel" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected) { throw "Hash mismatch for $rel`: $hash" }
          }

      - name: Materialize clean 45-file source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetPaths = @(
            'CSharpHost/assets/app-128.png','CSharpHost/assets/app-256.png','CSharpHost/assets/app-512.png','CSharpHost/assets/app.ico',
            'CSharpHost/assets/platform-kick.png','CSharpHost/assets/platform-twitch.png',
            'CSharpHost/assets/theme-blue-raccoon.png','CSharpHost/assets/theme-green-raccoon.png','CSharpHost/assets/theme-pink-raccoon.png','CSharpHost/assets/theme-purple-raccoon.png','CSharpHost/assets/theme-red-raccoon.png',
            'CSharpHost/web/favicon-192.png','CSharpHost/web/favicon-64.png','CSharpHost/web/favicon.ico'
          )
          $stash = Join-Path $env:RUNNER_TEMP 'SleepyChatBinaryAssets'
          foreach ($rel in $assetPaths) {
            if (-not (Test-Path $rel)) { throw "Missing repository asset: $rel" }
            $dest = Join-Path $stash $rel
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item $rel $dest -Force
          }
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Get-ChildItem $env:TEXT_SOURCE_ROOT -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          foreach ($rel in $assetPaths) {
            $src = Join-Path $stash $rel
            $dest = Join-Path $PWD $rel
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item $src $dest -Force
          }
          $files = @(Get-ChildItem . -Recurse -File -Force | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          if ($files.Count -ne 45) { throw "Expected exactly 45 source files, found $($files.Count)." }
          node --check CSharpHost/web/js/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax validation failed.' }

      - name: Commit clean source to PR branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          $count = [int](git ls-files | Measure-Object -Line).Lines
          if ($count -ne 45) { throw "Final Git tree should contain exactly 45 files; found $count." }
          git commit -m 'Publish SleepyChat 1.0.0 source [skip ci]'
          $sha = (git rev-parse HEAD).Trim()
          "PUBLISHED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git push origin HEAD:${{ github.head_ref }}

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\BUILD_RELEASE.ps1

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist\SleepyChat 1.0.0\SleepyChat.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($s.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package clean release ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publicDir = Join-Path $PWD 'dist\SleepyChat 1.0.0'
          foreach ($file in @('BUILD_INFO.txt','readme.txt','release_notes.txt')) { Copy-Item $file $publicDir -Force }
          Compress-Archive -Path $publicDir -DestinationPath 'SleepyChat_1.0.0_Public.zip' -CompressionLevel Optimal -Force

          $sourceStage = Join-Path $env:RUNNER_TEMP 'SleepyChatSourcePackage'
          $sourceDir = Join-Path $sourceStage 'SleepyChat 1.0.0 Source'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          foreach ($rel in (git ls-files)) {
            $dest = Join-Path $sourceDir $rel
            New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
            Copy-Item $rel $dest -Force
          }
          Compress-Archive -Path $sourceDir -DestinationPath 'SleepyChat_1.0.0_Source.zip' -CompressionLevel Optimal -Force

      - name: Replace v1.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete v1.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = 'Stop'
          gh release create v1.0.0 'SleepyChat_1.0.0_Public.zip' 'SleepyChat_1.0.0_Source.zip' --repo "${{ github.repository }}" --target "$env:PUBLISHED_SHA" --title 'SleepyChat 1.0.0' --notes-file release_notes.txt --latest
