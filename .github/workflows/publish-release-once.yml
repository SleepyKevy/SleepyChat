name: Publish SleepyChat 1.0.0 from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download exact SleepyChat source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'SleepyChat_1.0.0_Source.zip'
          $fileId = '1pTZKM_WN-JBBLkUqPeaPlJYV-Qsh3p0v'
          python -m pip install --disable-pip-version-check --quiet gdown
          python -m gdown $fileId -O $zip
          if ($LASTEXITCODE -ne 0) { throw 'gdown failed to download the exact source ZIP.' }
          if (-not (Test-Path $zip)) { throw 'SleepyChat source ZIP was not downloaded.' }
          $size = (Get-Item $zip).Length
          if ($size -lt 10000000) { throw "Downloaded source ZIP is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fd0d8e6e60e46a72c834efcdd0b4c1ef0b8d3e57519599fca010861b4a7d5ee7') { throw "Source ZIP hash mismatch: $hash" }
          "SOURCE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize exact source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'SleepyChatSourceExtract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar.exe -xf $env:SOURCE_ZIP -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Source ZIP extraction failed.' }
          $sourceRoot = Join-Path $extract 'SleepyChat 1.0.0 Source'
          if (-not (Test-Path $sourceRoot)) { throw 'Expected source root folder is missing.' }
          $files = @(Get-ChildItem $sourceRoot -Recurse -File)
          if ($files.Count -ne 45) { throw "Expected exactly 45 source files, found $($files.Count)." }
          foreach ($required in @('README.md','BUILD_RELEASE.ps1','CSharpHost/SleepyChat.csproj','CSharpHost/App/Program.cs','CSharpHost/Backend/BackendHost.cs','CSharpHost/web/index.html','.github/workflows/csharp-runtime-smoke.yml')) {
            if (-not (Test-Path (Join-Path $sourceRoot $required))) { throw "Missing required source file: $required" }
          }
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Get-ChildItem $sourceRoot -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          node --check CSharpHost/web/js/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax validation failed.' }

      - name: Commit exact source to PR branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          $count = [int](git ls-files | Measure-Object -Line).Lines
          if ($count -ne 45) { throw "Final Git tree should contain exactly 45 files; found $count." }
          git commit -m 'Publish SleepyChat 1.0.0 source'
          $sha = (git rev-parse HEAD).Trim()
          "PUBLISHED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git push origin HEAD:${{ github.head_ref }}

      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\BUILD_RELEASE.ps1

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist\SleepyChat 1.0.0\SleepyChat.exe'
          $env:SLEEPYCHAT_HEADLESS = '1'
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($s.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package clean release ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publicDir = Join-Path $PWD 'dist\SleepyChat 1.0.0'
          foreach ($file in @('BUILD_INFO.txt','readme.txt','release_notes.txt')) { if (Test-Path $file) { Copy-Item $file $publicDir -Force } }
          Compress-Archive -Path $publicDir -DestinationPath 'SleepyChat_1.0.0_Public.zip' -CompressionLevel Optimal -Force
          Copy-Item $env:SOURCE_ZIP 'SleepyChat_1.0.0_Source.zip' -Force

      - name: Replace v1.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete v1.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = 'Stop'
          gh release create v1.0.0 'SleepyChat_1.0.0_Public.zip' 'SleepyChat_1.0.0_Source.zip' --repo "${{ github.repository }}" --target "$env:PUBLISHED_SHA" --title 'SleepyChat 1.0.0' --notes-file release_notes.txt --latest
