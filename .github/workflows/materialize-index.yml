name: Materialize exact SleepyChat UI

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/MATERIALIZE_INDEX'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild and verify canonical index.html
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          parts = [pathlib.Path(f'.bootstrap/exact-ui/{n}.txt') for n in ('000','001','002')]
          raw = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(raw) == 22872, f'base64 length {len(raw)}'
          packed = base64.b64decode(raw, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '6c32288007aa36f302aee3d232780ea8ffd0a1b4c36ebc565cc7b1416f654efe'
          data = gzip.decompress(packed)
          assert len(data) == 59234, len(data)
          path = pathlib.Path('CSharpHost/web/index.html')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          git_sha = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          assert git_sha == '79454247d3bf906b7bac25d898cf2bb8cd3038ce', git_sha
      - name: Commit canonical UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'SleepyChat Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CSharpHost/web/index.html
          if (git diff --cached --quiet) { throw 'Canonical UI produced no change.' }
          git commit -m 'Materialize exact SleepyChat 1.0.0 UI'
          git push origin HEAD:main
