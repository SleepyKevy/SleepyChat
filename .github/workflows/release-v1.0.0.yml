name: Publish SleepyChat 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.release/bootstrap-v1.0.0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleepychat-v1.0.0-release
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Finalize supplied release assets
        id: finalize
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bootstrap = '.release/bootstrap-v1.0.0'
          $finalSha = (git rev-parse HEAD).Trim()

          if (Test-Path $bootstrap) {
            # Preserve release-infrastructure fixes that were made after the RC1
            # source-text bundle was created.
            $smokeWorkflowBackup = Join-Path $env:RUNNER_TEMP 'csharp-runtime-smoke.yml'
            Copy-Item '.github/workflows/csharp-runtime-smoke.yml' $smokeWorkflowBackup -Force

            $textParts = @(Get-ChildItem '.release-text-assets' -Filter 'text.part*.b64' -File | Sort-Object Name)
            if ($textParts.Count -eq 0) { throw 'Release source-text bundle parts are missing.' }

            $textEncoded = ($textParts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            $textBytes = [Convert]::FromBase64String($textEncoded)
            $textBundlePath = Join-Path $env:RUNNER_TEMP 'SleepyChat-release-text.zip'
            [IO.File]::WriteAllBytes($textBundlePath, $textBytes)
            $textHash = (Get-FileHash $textBundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($textHash -ne 'cfd74f8f20d4512d9e693ece5d52407dd29f36fbba2d01b8fd197a06c8947f64') {
              throw "Release source-text bundle hash mismatch: $textHash"
            }
            Expand-Archive -Path $textBundlePath -DestinationPath (Get-Location) -Force
            Copy-Item $smokeWorkflowBackup '.github/workflows/csharp-runtime-smoke.yml' -Force

            $parts = @(Get-ChildItem '.release-assets' -Filter 'bundle.part*.b64' -File | Sort-Object Name)
            if ($parts.Count -eq 0) { throw 'Release asset bundle parts are missing.' }

            $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            $bundleBytes = [Convert]::FromBase64String($encoded)
            $bundlePath = Join-Path $env:RUNNER_TEMP 'SleepyChat-release-assets.zip'
            [IO.File]::WriteAllBytes($bundlePath, $bundleBytes)
            $bundleHash = (Get-FileHash $bundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($bundleHash -ne '1e0d139051b2f2f086ba87a47b8304ee20c8b473887c2f7a0631043eb77f7c21') {
              throw "Release asset bundle hash mismatch: $bundleHash"
            }

            $stage = Join-Path $env:RUNNER_TEMP 'sleepychat-release-assets'
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
            Expand-Archive -Path $bundlePath -DestinationPath $stage -Force

            Copy-Item (Join-Path $stage 'CSharpHost\assets\app.ico') 'CSharpHost\assets\app.ico' -Force
            foreach ($color in @('blue','red','purple','green','pink')) {
              Copy-Item (Join-Path $stage "CSharpHost\assets\theme-$color-raccoon.png") "CSharpHost\assets\theme-$color-raccoon.png" -Force
            }
            Copy-Item 'CSharpHost\assets\app.ico' 'CSharpHost\web\favicon.ico' -Force

            $expected = @{
              'CSharpHost/assets/app.ico' = '3b7e220ea75a9822db2ae6691c4532fe831c6740bb3c52e2e3ebdee0eeb7ce3e'
              'CSharpHost/assets/theme-blue-raccoon.png' = '4daeb58e6b79b06e328e89a4a47fee974a6630a1c651edc44cc65ccc27f573ea'
              'CSharpHost/assets/theme-red-raccoon.png' = '2536d21a0d406fd9b11a3f36febda72a818ed96df62c2ff9a1f17139d1a0f8c1'
              'CSharpHost/assets/theme-purple-raccoon.png' = 'af91aa5bacee14d45f6bfd59784d1d6d7cc14bdc58a7d081b69396b8257d1c2b'
              'CSharpHost/assets/theme-green-raccoon.png' = '48e46a46e334b057b8d991797e6db798ef01b0390611049e8ee54410aea86123'
              'CSharpHost/assets/theme-pink-raccoon.png' = 'e4d32f000f6ed86a52ba5652b9819d7f3ed9db89c020d96996a72b5d03edbc0f'
            }
            foreach ($entry in $expected.GetEnumerator()) {
              if (-not (Test-Path $entry.Key)) { throw "Required release asset missing: $($entry.Key)" }
              $actual = (Get-FileHash $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $entry.Value) { throw "Release asset hash mismatch: $($entry.Key)" }
            }

            Add-Type -AssemblyName System.Drawing
            $ico = [System.Drawing.Icon]::new((Resolve-Path 'CSharpHost/assets/app.ico').Path, 128, 128)
            $sourceBitmap = $ico.ToBitmap()
            try {
              $targets = @{
                'CSharpHost/assets/app-128.png' = 128
                'CSharpHost/assets/app-256.png' = 256
                'CSharpHost/assets/app-512.png' = 512
                'CSharpHost/web/favicon-64.png' = 64
                'CSharpHost/web/favicon-192.png' = 192
              }
              foreach ($target in $targets.GetEnumerator()) {
                $bmp = New-Object System.Drawing.Bitmap($target.Value, $target.Value)
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                try {
                  $g.Clear([System.Drawing.Color]::Transparent)
                  $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                  $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                  $g.DrawImage($sourceBitmap, 0, 0, $target.Value, $target.Value)
                  $bmp.Save($target.Key, [System.Drawing.Imaging.ImageFormat]::Png)
                } finally {
                  $g.Dispose()
                  $bmp.Dispose()
                }
              }
            } finally {
              $sourceBitmap.Dispose()
              $ico.Dispose()
            }

            Remove-Item '.release-assets' -Recurse -Force
            Remove-Item '.release-text-assets' -Recurse -Force
            Remove-Item $bootstrap -Force
            New-Item -ItemType Directory -Path '.release' -Force | Out-Null
            Set-Content '.release/v1.0.0' 'SleepyChat 1.0.0 official release source' -Encoding UTF8

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Finalize SleepyChat 1.0.0 release assets'

            # Main can move while this Windows build is running. Replay the
            # release finalization commit on top of the newest main before push.
            git pull --rebase origin main
            git push origin HEAD:main
            $finalSha = (git rev-parse HEAD).Trim()
          }

          "final_sha=$finalSha" >> $env:GITHUB_OUTPUT
          "Release source commit: $finalSha" >> $env:GITHUB_STEP_SUMMARY

      - name: Build and package official release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./PACKAGE_RELEASE.ps1
          foreach ($path in @(
            'dist/SleepyChat 1.0.0/SleepyChat.exe',
            'dist/SleepyChat_1.0.0_Public.zip',
            'dist/SleepyChat_1.0.0_Source.zip'
          )) {
            if (-not (Test-Path $path)) { throw "Release output missing: $path" }
          }

      - name: Smoke-test newly built executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist/SleepyChat 1.0.0/SleepyChat.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $status = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($status.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }

            foreach ($route in @('/','/css/app.css','/css/ui-polish.css','/js/app.js')) {
              $r = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "Static route failed: $route" }
            }

            $kick = Invoke-RestMethod "$base/api/kick-config" -TimeoutSec 5
            if ($kick.api_base -ne 'https://sleepysource-api.sleepyservices.workers.dev') {
              throw 'Unexpected hosted Kick API base.'
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Verify packaged ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zipPath in @('dist/SleepyChat_1.0.0_Public.zip','dist/SleepyChat_1.0.0_Source.zip')) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
            try {
              if ($zip.Entries.Count -eq 0) { throw "Empty ZIP: $zipPath" }
            } finally { $zip.Dispose() }
          }
          $pubHash = (Get-FileHash 'dist/SleepyChat_1.0.0_Public.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $srcHash = (Get-FileHash 'dist/SleepyChat_1.0.0_Source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "Public SHA256: $pubHash" >> $env:GITHUB_STEP_SUMMARY
          "Source SHA256: $srcHash" >> $env:GITHUB_STEP_SUMMARY

      - name: Save verified release packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Release
          path: |
            dist/SleepyChat_1.0.0_Public.zip
            dist/SleepyChat_1.0.0_Source.zip
          if-no-files-found: error

      - name: Replace official v1.0.0 GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.finalize.outputs.final_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.0'

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the previous v1.0.0 release.' }
          } else {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($existingTag) {
              git push origin ":refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw 'Could not remove the previous v1.0.0 tag.' }
            }
          }

          gh release create $tag `
            'dist/SleepyChat_1.0.0_Public.zip' `
            'dist/SleepyChat_1.0.0_Source.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:FINAL_SHA `
            --title 'SleepyChat 1.0.0' `
            --notes-file 'release_notes.txt' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
