name: Publish SleepyChat 1.0.0 Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.release-v1.0.0-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request' || github.head_ref == 'release/sleepychat-v1.0.0'
    runs-on: windows-latest
    steps:
      - name: Checkout verified main source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Repair icon resources and persist to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-PngIcon([string]$pngPath, [string]$icoPath, [int]$size) {
            $png = [IO.File]::ReadAllBytes($pngPath)
            if ($png.Length -lt 8 -or $png[0] -ne 0x89 -or $png[1] -ne 0x50 -or $png[2] -ne 0x4E -or $png[3] -ne 0x47) {
              throw "Not a PNG: $pngPath"
            }
            $w = if ($size -ge 256) { [byte]0 } else { [byte]$size }
            $h = if ($size -ge 256) { [byte]0 } else { [byte]$size }
            $stream = [IO.MemoryStream]::new()
            $writer = [IO.BinaryWriter]::new($stream)
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]1)
            $writer.Write($w)
            $writer.Write($h)
            $writer.Write([byte]0)
            $writer.Write([byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]$png.Length)
            $writer.Write([UInt32]22)
            $writer.Write($png)
            $writer.Flush()
            $ico = $stream.ToArray()
            $writer.Dispose()
            $stream.Dispose()
            [IO.File]::WriteAllBytes($icoPath, $ico)
          }

          Write-PngIcon 'CSharpHost\assets\app-256.png' 'CSharpHost\assets\app.ico' 256
          Write-PngIcon 'CSharpHost\web\favicon-192.png' 'CSharpHost\web\favicon.ico' 192
          foreach ($path in @('CSharpHost\assets\app.ico','CSharpHost\web\favicon.ico')) {
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 1000 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
              throw "Generated ICO validation failed: $path"
            }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSharpHost/assets/app.ico CSharpHost/web/favicon.ico
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Repair SleepyChat icon resources [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit repaired icon resources.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not push repaired icon resources to main.' }
          }

      - name: Package clean source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'source-package'
          $wrapper = Join-Path $root 'SleepyChat 1.0.0 Source'
          New-Item -ItemType Directory -Path $wrapper -Force | Out-Null
          foreach ($item in @('.gitignore','BUILD_INFO.txt','BUILD_RELEASE.ps1','README.md','readme.txt','release_notes.txt','CSharpHost','docs')) {
            Copy-Item $item $wrapper -Recurse -Force
          }
          $wf = Join-Path $wrapper '.github\workflows'
          New-Item -ItemType Directory -Path $wf -Force | Out-Null
          Copy-Item '.github\workflows\csharp-runtime-smoke.yml' $wf -Force
          $files = @(Get-ChildItem $wrapper -Recurse -File -Force)
          if ($files.Count -ne 45) { throw "Source package should contain exactly 45 files; found $($files.Count)." }
          Compress-Archive -Path $wrapper -DestinationPath 'SleepyChat_1.0.0_Source.zip' -CompressionLevel Optimal -Force

      - name: Pin .NET 8 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk8 = @(dotnet --list-sdks | ForEach-Object { if ($_ -match '^(8\.\d+\.\d+)') { $Matches[1] } }) | Select-Object -Last 1
          if (-not $sdk8) { throw '.NET 8 SDK was not found after setup.' }
          @{ sdk = @{ version = $sdk8; rollForward = 'latestPatch'; allowPrerelease = $false } } | ConvertTo-Json -Depth 4 | Set-Content 'global.json' -Encoding utf8
          $active = (dotnet --version).Trim()
          if (-not $active.StartsWith('8.')) { throw "Expected .NET 8, got $active" }
          Write-Host "Pinned .NET SDK $active"

      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./BUILD_RELEASE.ps1

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist\SleepyChat 1.0.0\SleepyChat.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $status = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($status.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }
            foreach ($route in @('/','/css/app.css','/css/ui-polish.css','/js/app.js')) {
              $response = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($response.StatusCode -ne 200) { throw "Static route failed: $route" }
            }
            $kick = Invoke-RestMethod "$base/api/kick-config" -TimeoutSec 5
            if ($kick.api_base -ne 'https://sleepysource-api.sleepyservices.workers.dev') { throw 'Wrong Kick API base.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package clean public ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $public = 'dist\SleepyChat 1.0.0'
          foreach ($item in @('BUILD_INFO.txt','readme.txt','release_notes.txt')) {
            Copy-Item $item $public -Force
          }
          if (-not (Test-Path "$public\SleepyChat.exe")) { throw 'SleepyChat.exe is missing from the public package.' }
          Compress-Archive -Path $public -DestinationPath 'SleepyChat_1.0.0_Public.zip' -CompressionLevel Optimal -Force

      - name: Publish v1.0.0 GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            gh release delete v1.0.0 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace existing v1.0.0 release.' }
          }
          gh release create v1.0.0 'SleepyChat_1.0.0_Public.zip' 'SleepyChat_1.0.0_Source.zip' --repo $env:GITHUB_REPOSITORY --target main --title 'SleepyChat 1.0.0' --notes-file 'release_notes.txt' --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
