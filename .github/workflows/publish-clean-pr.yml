name: Publish Clean SleepyChat 1.0.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    if: github.head_ref == 'agent/publish-sleepychat-1.0.0'
    runs-on: windows-latest
    steps:
      - name: Checkout clean PR source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate clean source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $count = [int](git ls-files | Measure-Object -Line).Lines
          if ($count -ne 42) { throw "Expected 42 tracked source files, found $count." }
          if (Test-Path '.build') { throw 'Temporary .build directory is still present.' }
          foreach ($required in @('README.md','BUILD_RELEASE.ps1','CSharpHost/SleepyChat.csproj','CSharpHost/App/Program.cs','CSharpHost/Backend/BackendHost.cs','CSharpHost/web/index.html','.github/workflows/csharp-runtime-smoke.yml')) {
            if (-not (Test-Path $required)) { throw "Missing required source file: $required" }
          }
          node --check CSharpHost/web/js/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax validation failed.' }

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\BUILD_RELEASE.ps1

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist\SleepyChat 1.0.0\SleepyChat.exe'
          $env:SLEEPYCHAT_HEADLESS = '1'
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($s.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package clean release ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publicDir = Join-Path $PWD 'dist\SleepyChat 1.0.0'
          foreach ($file in @('BUILD_INFO.txt','readme.txt','release_notes.txt')) { if (Test-Path $file) { Copy-Item $file $publicDir -Force } }
          Compress-Archive -Path $publicDir -DestinationPath 'SleepyChat_1.0.0_Public.zip' -CompressionLevel Optimal -Force

          $sourceRoot = Join-Path $PWD 'release-source\SleepyChat 1.0.0 Source'
          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
          Get-ChildItem $PWD -Force | Where-Object { $_.Name -notin @('.git','dist','release-source','SleepyChat_1.0.0_Public.zip','SleepyChat_1.0.0_Source.zip') } | ForEach-Object {
            Copy-Item $_.FullName $sourceRoot -Recurse -Force
          }
          Compress-Archive -Path $sourceRoot -DestinationPath 'SleepyChat_1.0.0_Source.zip' -CompressionLevel Optimal -Force

      - name: Replace v1.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete v1.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          gh release create v1.0.0 'SleepyChat_1.0.0_Public.zip' 'SleepyChat_1.0.0_Source.zip' --repo "${{ github.repository }}" --target $sha --title 'SleepyChat 1.0.0' --notes-file release_notes.txt --latest
