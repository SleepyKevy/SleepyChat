name: Probe existing SleepyChat release assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing releases and asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo '=== releases ==='
          gh release list --repo "${{ github.repository }}" || true
          mkdir -p "$RUNNER_TEMP/release-assets"
          if gh release download v1.0.0 --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/release-assets"; then
            echo '=== v1.0.0 assets ==='
            find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -printf '%f\n' | sort
            echo '=== sha256 ==='
            sha256sum "$RUNNER_TEMP/release-assets"/* || true
          else
            echo 'NO_V100_RELEASE'
          fi
