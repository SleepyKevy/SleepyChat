name: Compile SleepyChat PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v6

      - name: Record build run ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "SLEEPYCHAT_BUILD_RUN_ID=${{ github.run_id }}"

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Extract and repair corrected C# source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'build-src' -Force | Out-Null
          & tar.exe -xf 'SleepyChat_1.0.0_CSharp_BuildPayload.zip' -C 'build-src'
          $tarCode = $LASTEXITCODE
          if ($tarCode -ne 0) { Write-Host "Archive reported code $tarCode; applying known BackendHost repair." }
          $encoded = (Get-Content -LiteralPath 'buildfix/BackendHost.cs.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('BackendHost.cs.gz', [Convert]::FromBase64String($encoded))
          & tar.exe -xzf 'BackendHost.cs.gz' -O | Set-Content -LiteralPath 'build-src/CSharpHost/BackendHost.cs' -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'BackendHost repair decompression failed.' }
          if (-not (Test-Path 'build-src/CSharpHost/SleepyChat.csproj')) { throw 'Corrected C# project missing from build payload.' }
          foreach ($required in @('Program.cs','AppUtil.cs','MainForm.cs','IntegrationConfig.cs','BackendHost.cs','SleepyChat.csproj','assets/app.ico')) {
            if (-not (Test-Path (Join-Path 'build-src/CSharpHost' $required))) { throw "Required build file missing: $required" }
          }
          if (Get-ChildItem 'build-src' -Recurse -Filter *.go -File -ErrorAction SilentlyContinue) { throw 'Unexpected Go source in corrected build payload.' }

      - name: Publish Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore 'build-src/CSharpHost/SleepyChat.csproj' -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet publish 'build-src/CSharpHost/SleepyChat.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o 'publish'
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path 'publish/SleepyChat.exe')) { throw 'SleepyChat.exe was not produced.' }

      - name: Upload compiled executable
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Compiled-EXE
          path: publish/SleepyChat.exe
          if-no-files-found: error

      - name: Verify executable version metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/SleepyChat.exe').Path
          $v = (Get-Item -LiteralPath $exe).VersionInfo
          Write-Host "FileVersion=$($v.FileVersion)"
          Write-Host "ProductVersion=$($v.ProductVersion)"
          if ($v.FileVersion -notlike '1.0.0*') { throw "Unexpected FileVersion: $($v.FileVersion)" }
          if ($v.ProductVersion -notlike '1.0.0*') { throw "Unexpected ProductVersion: $($v.ProductVersion)" }

      - name: Smoke test corrected C# backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/SleepyChat.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early with code $($proc.ExitCode)." }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:17892/api/status' -TimeoutSec 2
                Write-Host "status version=$($status.version) host=$($status.host)"
                if ($status.version -eq '1.0.0' -and $status.host -eq 'csharp-webview2') { $ready = $true; break }
              } catch {
                Write-Host "Waiting for backend: $($_.Exception.Message)"
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Corrected C# backend did not become ready.' }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
