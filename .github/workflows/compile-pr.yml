name: Compile SleepyChat PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout corrected C# source
        uses: actions/checkout@v6

      - name: Record build run ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "SLEEPYCHAT_BUILD_RUN_ID=${{ github.run_id }}"

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate corrected window host and prepare icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'directsrc/CSharpHost/SleepyChat.csproj')) { throw 'Direct C# project is missing.' }
          New-Item -ItemType Directory -Path 'directsrc/CSharpHost/assets' -Force | Out-Null

          $backendEncoded = (Get-Content -LiteralPath 'directsrc/BackendHost.cs.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('BackendHost.cs.gz', [Convert]::FromBase64String($backendEncoded))
          $inputStream = [IO.File]::OpenRead('BackendHost.cs.gz')
          try {
            $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
            try {
              $outputStream = [IO.File]::Create('directsrc/CSharpHost/BackendHost.cs')
              try { $gzipStream.CopyTo($outputStream) }
              finally { $outputStream.Dispose() }
            }
            finally { $gzipStream.Dispose() }
          }
          finally { $inputStream.Dispose() }

          $iconParts = @(
            'directsrc/iconparts/part-00a.txt',
            'directsrc/iconparts/part-00b.txt',
            'directsrc/iconparts/part-01.txt',
            'directsrc/iconparts/part-02.txt',
            'directsrc/iconparts/part-03.txt',
            'directsrc/iconparts/part-04.txt'
          )
          $iconEncoded = ($iconParts | ForEach-Object { (Get-Content -LiteralPath $_ -Raw).Trim() }) -join ''
          if ($iconEncoded.Length -ne 48256) { throw "Unexpected icon Base64 length: $($iconEncoded.Length)" }
          [IO.File]::WriteAllBytes('directsrc/CSharpHost/assets/app.ico', [Convert]::FromBase64String($iconEncoded))
          $iconHash = (Get-FileHash 'directsrc/CSharpHost/assets/app.ico' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($iconHash -ne 'f516c3e553e680bb73226364da09f0a356d5f749a5df552b85c8b933af5a5e60') { throw "SleepyChat icon hash mismatch: $iconHash" }

          $main = Get-Content -LiteralPath 'directsrc/CSharpHost/MainForm.cs' -Raw
          foreach ($forbidden in @('ToggleFullscreen','fullscreenRestoreBounds','fullscreenRestoreState','private bool fullscreen','Keys.F11','AcceleratorKeyPressed','OnWebViewAcceleratorKeyPressed','Screen.FromControl(this).Bounds','Screen.FromControl(this).WorkingArea')) {
            if ($main.Contains($forbidden)) { throw "Forbidden F11/fullscreen code still present: $forbidden" }
          }
          foreach ($required in @('AreBrowserAcceleratorKeysEnabled = false','CaptionButtonKind','RestoreGlyph','WS_MAXIMIZEBOX','WS_MINIMIZEBOX','WS_THICKFRAME','ToggleMaximize')) {
            if (-not $main.Contains($required)) { throw "Required native-window contract missing: $required" }
          }
          if ($main.Contains('CreateCaptionButton("×"') -or $main.Contains('CreateCaptionButton("□"') -or $main.Contains('CreateCaptionButton("—"')) {
            throw 'Legacy Unicode caption-button glyphs are still present.'
          }

          foreach ($required in @('Program.cs','AppUtil.cs','MainForm.cs','IntegrationConfig.cs','BackendHost.cs','SleepyChat.csproj','assets/app.ico')) {
            if (-not (Test-Path (Join-Path 'directsrc/CSharpHost' $required))) { throw "Required source file missing: $required" }
          }
          if (Get-ChildItem 'directsrc' -Recurse -Filter *.go -File -ErrorAction SilentlyContinue) { throw 'Unexpected Go source in corrected build.' }

      - name: Publish Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore 'directsrc/CSharpHost/SleepyChat.csproj' -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet publish 'directsrc/CSharpHost/SleepyChat.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o 'publish'
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path 'publish/SleepyChat.exe')) { throw 'SleepyChat.exe was not produced.' }

      - name: Upload compiled executable
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Native-Maximize
          path: publish/SleepyChat.exe
          if-no-files-found: error

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/SleepyChat.exe').Path
          $v = (Get-Item -LiteralPath $exe).VersionInfo
          if ($v.FileVersion -notlike '1.0.0*') { throw "Unexpected FileVersion: $($v.FileVersion)" }
          if ($v.ProductVersion -notlike '1.0.0*') { throw "Unexpected ProductVersion: $($v.ProductVersion)" }

      - name: Smoke test corrected C# backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/SleepyChat.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early with code $($proc.ExitCode)." }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:17892/api/status' -TimeoutSec 2
                if ($status.version -eq '1.0.0' -and $status.host -eq 'csharp-webview2') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Corrected C# backend did not become ready.' }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
