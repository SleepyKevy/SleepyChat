name: Fix SleepyChat 1.0.0 Public Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-release.yml'

permissions:
  contents: write

jobs:
  rebuild-public-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build clean Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./BUILD_RELEASE.ps1

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $exe = Resolve-Path 'dist/SleepyChat 1.0.0/SleepyChat.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try {
                $status = Invoke-RestMethod "$base/api/status" -TimeoutSec 2
                if ($status.version -eq '1.0.0') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not become ready.' }
            foreach ($route in @('/','/css/app.css','/css/ui-polish.css','/js/app.js')) {
              $r = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "Static route failed: $route" }
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prepare clean public package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist/SleepyChat 1.0.0'

          $data = Join-Path $out 'SleepyChat_Data'
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          Get-ChildItem $out -Filter 'Microsoft.Web.WebView2.*.xml' -File -ErrorAction SilentlyContinue | Remove-Item -Force

          Copy-Item 'BUILD_INFO.txt' $out -Force
          Copy-Item 'readme.txt' $out -Force
          Copy-Item 'release_notes.txt' $out -Force

          $allowedTopLevel = @('SleepyChat.exe','assets','web','BUILD_INFO.txt','readme.txt','release_notes.txt')
          $actualTopLevel = @(Get-ChildItem $out | ForEach-Object { $_.Name })
          $unexpected = @($actualTopLevel | Where-Object { $_ -notin $allowedTopLevel })
          if ($unexpected.Count -gt 0) { throw "Unexpected public package entries: $($unexpected -join ', ')" }

          foreach ($required in $allowedTopLevel) {
            if (-not (Test-Path (Join-Path $out $required))) { throw "Required public package entry missing: $required" }
          }

          if (Get-ChildItem $out -Filter 'Microsoft.Web.WebView2.*.xml' -File -ErrorAction SilentlyContinue) { throw 'WebView2 XML documentation files remain in public package.' }
          if (Test-Path (Join-Path $out 'SleepyChat_Data')) { throw 'SleepyChat_Data remains in public package.' }

          $zip = 'SleepyChat_1.0.0_Public.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal

      - name: Verify ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'SleepyChat_1.0.0_Public.zip'))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names | Where-Object { $_ -like '*Microsoft.Web.WebView2.*.xml' }) { throw 'WebView2 XML docs found in final ZIP.' }
            if ($names | Where-Object { $_ -like '*SleepyChat_Data*' }) { throw 'SleepyChat_Data found in final ZIP.' }
            if (-not ($names | Where-Object { $_ -like '*SleepyChat.exe' })) { throw 'SleepyChat.exe missing from final ZIP.' }
          } finally {
            $zip.Dispose()
          }

      - name: Replace GitHub release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload v1.0.0 SleepyChat_1.0.0_Public.zip --clobber --repo $env:GITHUB_REPOSITORY

      - name: Record successful cleanup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-FileHash 'SleepyChat_1.0.0_Public.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $body = "SleepyChat 1.0.0 public release verified clean`nsha256=$sha`nentries=SleepyChat.exe, assets/, web/, BUILD_INFO.txt, readme.txt, release_notes.txt`nremoved=SleepyChat_Data/, Microsoft.Web.WebView2.*.xml`n"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.github/release-public-clean.txt" -f message='Record clean public release [skip ci]' -f content=$encoded -f branch=main | Out-Null

      - name: Upload clean package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat_1.0.0_Public_Clean
          path: SleepyChat_1.0.0_Public.zip
          if-no-files-found: error
