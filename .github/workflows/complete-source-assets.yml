name: Complete SleepyChat Source Import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  complete-source:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Verify and restore final repository payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(Get-ChildItem '.bootstrap' -Filter 'repo.b64.*' -File | Sort-Object Name)
          if ($parts.Count -lt 1) { throw 'No final repository payload chunks were found.' }

          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:RUNNER_TEMP 'SleepyChat_1.0.0_GitHubRepo_Final.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '92cc07842a267e86884b98f35e0a856cd2c5fcbc3f5745ba80b505d4fd8aa269') {
            throw "Final repository payload checksum mismatch: $hash"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'sleepychat-final-repo'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -Path $zip -DestinationPath $stage -Force

          $files = @(Get-ChildItem $stage -Recurse -File)
          if ($files.Count -ne 32) { throw "Expected 32 repository files, found $($files.Count)." }

          $htmlPath = Join-Path $stage 'CSharpHost/web/index.html'
          if ((Get-Item $htmlPath).Length -ne 59234) { throw 'Final index.html size mismatch.' }
          $html = [IO.File]::ReadAllText($htmlPath)
          foreach ($needle in @('/api/twitch-badges','/api/kick-badges','/api/kick-badge-image')) {
            if (-not $html.Contains($needle)) { throw "Final UI is missing: $needle" }
          }

          foreach ($required in @(
            '.github/workflows/csharp-runtime-smoke.yml',
            'CSharpHost/AppUtil.cs',
            'CSharpHost/BackendHost.cs',
            'CSharpHost/IntegrationConfig.cs',
            'CSharpHost/MainForm.cs',
            'CSharpHost/Program.cs',
            'CSharpHost/SleepyChat.csproj',
            'CSharpHost/assets/app.ico',
            'CSharpHost/assets/app-64.png',
            'CSharpHost/assets/app-128.png',
            'CSharpHost/assets/app-192.png',
            'CSharpHost/assets/app-256.png',
            'CSharpHost/assets/app-512.png',
            'CSharpHost/assets/platform-kick.png',
            'CSharpHost/assets/platform-twitch.png',
            'CSharpHost/assets/sleepychat-mark.webp',
            'CSharpHost/assets/theme-blue-raccoon.png',
            'CSharpHost/assets/theme-red-raccoon.png',
            'CSharpHost/assets/theme-purple-raccoon.png',
            'CSharpHost/assets/theme-green-raccoon.png',
            'CSharpHost/assets/theme-pink-raccoon.png',
            'CSharpHost/web/index.html',
            'CSharpHost/web/favicon.ico',
            'CSharpHost/web/favicon-64.png',
            'CSharpHost/web/favicon-192.png',
            'CSharpHost/web/manifest.webmanifest',
            'README.md',
            'VALIDATION.txt',
            'readme.txt',
            'release_notes.txt'
          )) {
            $full = Join-Path $stage $required
            if (-not (Test-Path $full)) { throw "Final repository file missing: $required" }
            if ((Get-Item $full).Length -eq 0) { throw "Final repository file is empty: $required" }
          }

          # Replace the source tree with the verified package while leaving .git intact.
          Get-ChildItem . -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne '.bootstrap' } | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $stage '*') . -Recurse -Force

      - name: Commit clean SleepyChat source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.bootstrap' -Recurse -Force
          Remove-Item '.github/workflows/complete-source-assets.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'SleepyChat Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete SleepyChat 1.0.0 source import'
          git push origin HEAD:main
