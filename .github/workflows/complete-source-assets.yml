name: Complete SleepyChat Source Assets

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  complete-assets:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Restore staged SleepyChat assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.bootstrap' -Filter 'assetpack.b64.*' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 asset payload chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:RUNNER_TEMP 'sleepychat-assets.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '55915c5af5c2e76e56998e41f98b3716f572daa94a0bdf34cfc9fdf4848c5b32') {
            throw "Asset payload checksum mismatch: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath . -Force

          $required = @(
            'CSharpHost/web/favicon.ico',
            'CSharpHost/web/favicon-64.png',
            'CSharpHost/web/favicon-192.png',
            'CSharpHost/assets/app.ico',
            'CSharpHost/assets/app-64.png',
            'CSharpHost/assets/app-128.png',
            'CSharpHost/assets/app-192.png',
            'CSharpHost/assets/app-256.png',
            'CSharpHost/assets/platform-kick.png',
            'CSharpHost/assets/platform-twitch.png',
            'CSharpHost/assets/theme-blue-raccoon.png',
            'CSharpHost/assets/theme-red-raccoon.png',
            'CSharpHost/assets/theme-purple-raccoon.png',
            'CSharpHost/assets/theme-green-raccoon.png',
            'CSharpHost/assets/theme-pink-raccoon.png'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing completed source asset: $path" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty completed source asset: $path" }
          }

      - name: Commit completed source assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.bootstrap' -Recurse -Force
          Remove-Item '.github/workflows/complete-source-assets.yml' -Force
          git config user.name 'SleepyChat Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete SleepyChat 1.0.0 source assets'
          git push origin HEAD:main
