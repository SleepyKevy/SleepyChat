name: SleepyChat Code Audit Refactor Build

on:
  push:
    branches: [code-audit-refactor-20260818]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-refactor:
    runs-on: windows-latest
    steps:
      - name: Checkout refactor
        uses: actions/checkout@v6

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Hydrate verified current assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'verified-edge-assets.zip'
          $root = Join-Path $env:RUNNER_TEMP 'verified-edge-assets'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/SleepyKevy/SleepyChat/actions/artifacts/9352316987/zip' -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $assets = Get-ChildItem $root -Directory -Recurse | Where-Object Name -eq 'assets' | Select-Object -First 1
          if (-not $assets) { throw 'Verified asset folder was not found.' }
          New-Item -ItemType Directory -Force CSharpHost/assets | Out-Null
          Copy-Item (Join-Path $assets.FullName '*') CSharpHost/assets -Recurse -Force
          if (-not (Test-Path CSharpHost/assets/app.ico)) { throw 'Verified app icon was not hydrated.' }

      - name: Validate cleaned C# structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'CSharpHost/App/Program.cs','CSharpHost/App/AppUtil.cs',
            'CSharpHost/Backend/BackendHost.cs','CSharpHost/Backend/BackendHost.Media.cs',
            'CSharpHost/Kick/HostedKickModels.cs','CSharpHost/Kick/HostedKickService.cs',
            'CSharpHost/Kick/HostedKickService.Delivery.cs','CSharpHost/Kick/HostedKickService.Storage.cs','CSharpHost/Kick/HostedKickService.Helpers.cs',
            'CSharpHost/Updates/UpdateService.cs',
            'CSharpHost/Window/MainForm.cs','CSharpHost/Window/MainForm.Resize.cs','CSharpHost/Window/MainForm.WebView.cs','CSharpHost/Window/MainForm.Window.cs','CSharpHost/Window/MainForm.CaptionButton.cs'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing refactor file: $path" } }
          foreach ($old in @('CSharpHost/AppUtil.cs','CSharpHost/BackendHost.cs','CSharpHost/IntegrationConfig.cs','CSharpHost/MainForm.cs','CSharpHost/Program.cs')) {
            if (Test-Path $old) { throw "Old flat source file still exists: $old" }
          }
          $kick = (Get-ChildItem CSharpHost/Kick -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($needle in @('https://sleepysource-api.sleepyservices.workers.dev','/oauth/kick/start','/oauth/kick/status','/kick/events/sync','/kick/chat/send','chat:write','JsonValueKind.String','ProtectCredential')) {
            if (-not $kick.Contains($needle)) { throw "Kick contract missing: $needle" }
          }
          foreach ($bad in @('sleepychat-api.sleepyservices.workers.dev','/kick/events/ensure-chat')) {
            if ($kick.Contains($bad)) { throw "Stale Kick contract present: $bad" }
          }
          $window = (Get-ChildItem CSharpHost/Window -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($needle in @('FormBorderStyle = FormBorderStyle.None','Size = new Size(1280, 820)','MinimumSize = new Size(980, 680)','HitTestResizeDirection','DWMWCP_DONOTROUND','IsGeneralAutofillEnabled = false','IsPasswordAutosaveEnabled = false')) {
            if (-not $window.Contains($needle)) { throw "Window contract missing: $needle" }
          }
          foreach ($bad in @('protected override CreateParams','WS_THICKFRAME','WM_NCCALCSIZE','CreateResizeGrips','AddResizeGrip')) {
            if ($window.Contains($bad)) { throw "Window regression present: $bad" }
          }

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepyChat.csproj -r win-x64
          dotnet publish CSharpHost/SleepyChat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o audit-dist
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path audit-dist/SleepyChat.exe)) { throw 'Publish failed.' }
          $v = (Get-Item audit-dist/SleepyChat.exe).VersionInfo
          if ($v.FileVersion -notlike '1.0.0*' -or $v.ProductVersion -notlike '1.0.0*') { throw 'Wrong EXE version.' }

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $proc = Start-Process -FilePath (Resolve-Path audit-dist/SleepyChat.exe) -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try { $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2; if ($s.version -eq '1.0.0') { $ready=$true; break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Backend did not become ready.' }
            $page = Invoke-WebRequest $base -TimeoutSec 5 -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw 'Root UI route failed.' }
            $kick = Invoke-RestMethod "$base/api/kick-config" -TimeoutSec 5
            if ($kick.api_base -ne 'https://sleepysource-api.sleepyservices.workers.dev') { throw 'Wrong Kick API base.' }
            $status = Invoke-WebRequest "$base/api/kick/status" -TimeoutSec 5 -UseBasicParsing
            if ($status.StatusCode -ne 200) { throw 'Kick status failed.' }
            try {
              Invoke-WebRequest "$base/api/kick/chat/send" -Method Post -ContentType 'application/json' -Body '{"content":"smoke"}' -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 400) { throw }
            }
            $update = Invoke-WebRequest "$base/api/update/check" -TimeoutSec 12 -UseBasicParsing
            if ($update.StatusCode -ne 200) { throw 'Update checker failed.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload verified refactor build
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Code-Audit-Refactor-Windows-x64
          path: audit-dist/
          if-no-files-found: error
