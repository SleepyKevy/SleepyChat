name: SleepyChat 1.0.0 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Reject legacy host code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $go = Get-ChildItem . -Recurse -Filter *.go -File -ErrorAction SilentlyContinue
          if ($go) { throw "Unexpected Go source found: $($go.FullName -join ', ')" }
          $needles = @(('Edge' + 'Profile'), ('ms' + 'edge.exe'), ('Set' + 'Parent('), ('FirstRun' + 'Bootstrap'), ('BUILD_FIRST' + '_RUN_EXE'))
          $files = Get-ChildItem . -Recurse -File | Where-Object {
            $_.FullName -notmatch '[\\/]\.git[\\/]' -and $_.Extension -in '.cs','.csproj','.html','.js','.css','.md','.txt','.ps1','.yml','.yaml','.webmanifest'
          }
          foreach ($needle in $needles) {
            if ($files | Where-Object { Select-String -Path $_.FullName -SimpleMatch $needle -Quiet }) { throw "Legacy release marker found: $needle" }
          }

      - name: Validate web bundle syntax and release strings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = [IO.File]::ReadAllText('CSharpHost/web/index.html')
          if ($html -notmatch 'SleepyChat 1\.0\.0') { throw 'SleepyChat 1.0.0 UI marker is missing.' }
          if ($html -match '(?i)\bprototype\b|Production SleepyChat should') { throw 'Prototype wording remains in the public UI.' }
          if ($html -notmatch '/api/twitch-badges' -or $html -notmatch '/api/kick-badges' -or $html -notmatch '/api/kick-badge-image') {
            throw 'Final badge API calls are missing from the UI.'
          }
          $scripts = [regex]::Matches($html, '(?is)<script(?:\s[^>]*)?>(.*?)</script>')
          if ($scripts.Count -lt 1) { throw 'No inline JavaScript found.' }
          $combined = ($scripts | ForEach-Object { $_.Groups[1].Value }) -join "`n"
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'sleepychat-inline.js'), $combined)
          node --check (Join-Path $env:RUNNER_TEMP 'sleepychat-inline.js')
          if ($LASTEXITCODE -ne 0) { throw 'Inline JavaScript syntax validation failed.' }
          Get-Content 'CSharpHost/web/manifest.webmanifest' -Raw | ConvertFrom-Json | Out-Null

      - name: Publish exact C# source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepyChat.csproj -r win-x64
          dotnet publish CSharpHost/SleepyChat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o smoke-dist
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path 'smoke-dist/SleepyChat.exe')) { throw 'SleepyChat.exe was not produced.' }
          foreach ($required in @(
            'smoke-dist/web/index.html',
            'smoke-dist/web/favicon.ico',
            'smoke-dist/assets/app.ico',
            'smoke-dist/assets/platform-kick.png',
            'smoke-dist/assets/platform-twitch.png',
            'smoke-dist/assets/theme-blue-raccoon.png',
            'smoke-dist/assets/theme-red-raccoon.png',
            'smoke-dist/assets/theme-purple-raccoon.png',
            'smoke-dist/assets/theme-green-raccoon.png',
            'smoke-dist/assets/theme-pink-raccoon.png'
          )) {
            if (-not (Test-Path $required)) { throw "Published file missing: $required" }
          }
          $v = (Get-Item 'smoke-dist/SleepyChat.exe').VersionInfo
          if ($v.FileVersion -notlike '1.0.0*' -or $v.ProductVersion -notlike '1.0.0*') {
            throw "Unexpected executable version: File=$($v.FileVersion) Product=$($v.ProductVersion)"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'smoke-dist/SleepyChat.exe').Path)
          if ($null -eq $icon) { throw 'SleepyChat.exe has no embedded application icon.' }
          $icon.Dispose()

      - name: Start C# backend and probe local contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $proc = Start-Process -FilePath (Resolve-Path 'smoke-dist/SleepyChat.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited before its backend became ready. Exit code: $($proc.ExitCode)" }
              try {
                $status = Invoke-WebRequest "$base/api/status" -TimeoutSec 2 -UseBasicParsing
                if ($status.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'SleepyChat backend did not bind to 127.0.0.1:17892 in time.' }

            $home = Invoke-WebRequest "$base/" -TimeoutSec 5 -UseBasicParsing
            if ($home.StatusCode -ne 200 -or $home.Content -notmatch 'SleepyChat 1\.0\.0') { throw 'SleepyChat UI contract failed.' }

            $statusJson = (Invoke-WebRequest "$base/api/status" -TimeoutSec 5 -UseBasicParsing).Content | ConvertFrom-Json
            if ($statusJson.version -ne '1.0.0' -or $statusJson.host -ne 'csharp-webview2') { throw 'C# host status contract failed.' }

            $kick = (Invoke-WebRequest "$base/api/kick-config" -TimeoutSec 5 -UseBasicParsing).Content | ConvertFrom-Json
            if ($null -eq $kick.available) { throw 'Kick config contract failed.' }

            try {
              Invoke-WebRequest "$base/api/kick-badges?slug=bad%20slug" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
              throw 'Invalid Kick slug was unexpectedly accepted.'
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 400) { throw }
            }

            $head = Invoke-WebRequest "$base/api/kick-badge-image" -Method Head -TimeoutSec 5 -UseBasicParsing
            if ($head.StatusCode -ne 204) { throw 'Kick badge HEAD compatibility route failed.' }

            Invoke-WebRequest "$base/api/ping" -Method Post -TimeoutSec 5 -UseBasicParsing | Out-Null
            Invoke-WebRequest "$base/api/window-closing" -Method Post -TimeoutSec 5 -UseBasicParsing | Out-Null
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify native window contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = [IO.File]::ReadAllText('CSharpHost/MainForm.cs')
          $program = [IO.File]::ReadAllText('CSharpHost/Program.cs')
          foreach ($needle in @(
            'FormBorderStyle = FormBorderStyle.None',
            'Size = new Size(1280, 820)',
            'private readonly NotifyIcon trayIcon;',
            'private const int WM_CLOSE = 0x0010',
            'ShowInTaskbar = true;',
            'WindowState == FormWindowState.Minimized',
            'Kill(entireProcessTree: true)',
            'DWMWA_USE_IMMERSIVE_DARK_MODE',
            'DWMWA_WINDOW_CORNER_PREFERENCE'
          )) {
            if (-not $main.Contains($needle)) { throw "Native window contract missing: $needle" }
          }
          foreach ($forbidden in @(
            'ToggleFullscreen',
            'fullscreenRestoreBounds',
            'fullscreenRestoreState',
            'private bool fullscreen',
            'Keys.F11',
            'AcceleratorKeyPressed',
            'OnWebViewAcceleratorKeyPressed'
          )) {
            if ($main.Contains($forbidden)) { throw "Forbidden F11/fullscreen contract present: $forbidden" }
          }
          foreach ($needle in @(
            'CaptionButtonKind',
            'RestoreGlyph',
            'WS_MAXIMIZEBOX',
            'WS_MINIMIZEBOX',
            'WS_THICKFRAME',
            'AreBrowserAcceleratorKeysEnabled = false'
          )) {
            if (-not $main.Contains($needle)) { throw "Native window contract missing: $needle" }
          }
          if (-not $program.Contains('SetCurrentProcessExplicitAppUserModelID("SleepyKev.SleepyChat.1.0.0")')) { throw 'Windows app identity marker is missing.' }
          if (-not $program.Contains('WM_XBUTTONDOWN') -or -not $program.Contains('APPCOMMAND_BROWSER_BACKWARD')) { throw 'Browser back/forward mouse filtering is missing.' }

      - name: Upload smoke-tested Windows build
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Windows-x64
          path: smoke-dist/
          if-no-files-found: error
