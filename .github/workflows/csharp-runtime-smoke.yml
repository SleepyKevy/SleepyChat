name: SleepyChat 1.0.0 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate cleaned source structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'CSharpHost/App/Program.cs','CSharpHost/App/AppUtil.cs',
            'CSharpHost/Backend/BackendHost.cs','CSharpHost/Backend/BackendHost.Media.cs',
            'CSharpHost/Kick/HostedKickModels.cs','CSharpHost/Kick/HostedKickService.cs',
            'CSharpHost/Kick/HostedKickService.Delivery.cs','CSharpHost/Kick/HostedKickService.Storage.cs','CSharpHost/Kick/HostedKickService.Helpers.cs',
            'CSharpHost/Updates/UpdateService.cs',
            'CSharpHost/Window/MainForm.cs','CSharpHost/Window/MainForm.Resize.cs','CSharpHost/Window/MainForm.WebView.cs','CSharpHost/Window/MainForm.Window.cs','CSharpHost/Window/MainForm.CaptionButton.cs',
            'CSharpHost/web/index.html','CSharpHost/web/css/app.css','CSharpHost/web/css/ui-polish.css','CSharpHost/web/js/app.js'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing cleaned source file: $path" } }
          if (Test-Path 'CloudflareWorker') { throw 'Stale CloudflareWorker folder must not be bundled.' }
          if (Get-ChildItem . -Recurse -Filter *.go -File -ErrorAction SilentlyContinue) { throw 'Unexpected Go source found.' }

      - name: Validate current contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kick = (Get-ChildItem 'CSharpHost/Kick' -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($needle in @('https://sleepysource-api.sleepyservices.workers.dev','/oauth/kick/start','/oauth/kick/status','/kick/events/sync','/kick/chat/send','chat:write','JsonValueKind.String','ProtectCredential')) {
            if (-not $kick.Contains($needle)) { throw "Kick contract missing: $needle" }
          }
          foreach ($bad in @('sleepychat-api.sleepyservices.workers.dev','/kick/events/ensure-chat')) {
            if ($kick.Contains($bad)) { throw "Stale Kick contract present: $bad" }
          }

          $window = (Get-ChildItem 'CSharpHost/Window' -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($needle in @('FormBorderStyle = FormBorderStyle.None','Size = new Size(1280, 820)','MinimumSize = new Size(980, 680)','HitTestResizeDirection','ResizeDirection.TopLeft','ResizeDirection.BottomRight','DWMWCP_DONOTROUND','IsGeneralAutofillEnabled = false','IsPasswordAutosaveEnabled = false')) {
            if (-not $window.Contains($needle)) { throw "Window contract missing: $needle" }
          }
          foreach ($bad in @('protected override CreateParams','WS_THICKFRAME','WM_NCCALCSIZE','CreateResizeGrips','AddResizeGrip')) {
            if ($window.Contains($bad)) { throw "Window regression present: $bad" }
          }

          $backend = (Get-ChildItem 'CSharpHost/Backend' -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($needle in @('127.0.0.1:17892','/api/kick/chat/send','/api/update/check','/css/{**name}','/js/{**name}')) {
            if (-not $backend.Contains($needle)) { throw "Backend contract missing: $needle" }
          }

      - name: Validate web bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = [IO.File]::ReadAllText('CSharpHost/web/index.html')
          if ($html -notmatch 'SleepyChat 1\.0\.0') { throw 'SleepyChat version marker missing from UI.' }
          if ($html.Contains('<style>') -or $html -match '<script>(?!\s*</script>)') { throw 'Inline CSS/JS returned to index.html.' }
          foreach ($needle in @('/css/app.css','/css/ui-polish.css','/js/app.js','Connect with Kick')) {
            if (-not $html.Contains($needle)) { throw "Web bundle reference missing: $needle" }
          }
          node --check CSharpHost/web/js/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax validation failed.' }
          Get-Content CSharpHost/web/manifest.webmanifest -Raw | ConvertFrom-Json | Out-Null

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepyChat.csproj -r win-x64
          dotnet publish CSharpHost/SleepyChat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o smoke-dist
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'smoke-dist/SleepyChat.exe')) { throw 'Publish failed.' }
          foreach ($path in @('smoke-dist/web/index.html','smoke-dist/web/css/app.css','smoke-dist/web/css/ui-polish.css','smoke-dist/web/js/app.js','smoke-dist/assets/app.ico','smoke-dist/assets/platform-kick.png','smoke-dist/assets/platform-twitch.png')) {
            if (-not (Test-Path $path)) { throw "Published file missing: $path" }
          }
          $v = (Get-Item 'smoke-dist/SleepyChat.exe').VersionInfo
          if ($v.FileVersion -notlike '1.0.0*' -or $v.ProductVersion -notlike '1.0.0*') { throw 'Wrong executable version.' }

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $proc = Start-Process -FilePath (Resolve-Path 'smoke-dist/SleepyChat.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try { $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2; if ($s.version -eq '1.0.0') { $ready=$true; break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Backend did not become ready.' }

            foreach ($route in @('/','/css/app.css','/css/ui-polish.css','/js/app.js')) {
              $r = Invoke-WebRequest ($base + $route) -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "Static route failed: $route" }
            }

            $kick = Invoke-RestMethod "$base/api/kick-config" -TimeoutSec 5
            if ($kick.api_base -ne 'https://sleepysource-api.sleepyservices.workers.dev') { throw 'Wrong Kick API base.' }
            $status = Invoke-WebRequest "$base/api/kick/status" -TimeoutSec 5 -UseBasicParsing
            if ($status.StatusCode -ne 200) { throw 'Kick status failed.' }
            try {
              Invoke-WebRequest "$base/api/kick/chat/send" -Method Post -ContentType 'application/json' -Body '{"content":"smoke"}' -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 400) { throw }
            }

            $update = Invoke-WebRequest "$base/api/update/check" -TimeoutSec 12 -UseBasicParsing
            if ($update.StatusCode -ne 200) { throw 'Update checker failed.' }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Windows-x64
          path: smoke-dist/
          if-no-files-found: error
