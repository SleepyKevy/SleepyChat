name: SleepyChat Update Checker Build V2

on:
  pull_request:
    branches: [oauth-build-base-20260818]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-update-checker-v2:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Use .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Apply working SleepyChat patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.build/oauth-patch.part*' -File | Sort-Object Name
          if (-not $parts) { throw 'OAuth patch chunks are missing.' }
          $zip = Join-Path $env:RUNNER_TEMP 'oauth-patch.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String((($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')))
          Expand-Archive -Path $zip -DestinationPath . -Force
          Remove-Item 'CSharpHost/IntegrationConfig.cs' -Force -ErrorAction SilentlyContinue

          $overrideGz = Join-Path $env:RUNNER_TEMP 'HostedKickService.cs.gz'
          [IO.File]::WriteAllBytes($overrideGz, [Convert]::FromBase64String((Get-Content '.build/shared-hostedkick.gz.b64' -Raw)))
          $input = [IO.File]::OpenRead($overrideGz)
          try {
            $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('CSharpHost/HostedKickService.cs')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          $sendGz = Join-Path $env:RUNNER_TEMP 'send-text.patch.gz'
          $sendPatch = Join-Path $env:RUNNER_TEMP 'send-text.patch'
          [IO.File]::WriteAllBytes($sendGz, [Convert]::FromBase64String((Get-Content '.build/send-text.patch.gz.b64' -Raw)))
          $input = [IO.File]::OpenRead($sendGz)
          try {
            $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($sendPatch)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          git apply --whitespace=nowarn $sendPatch
          if ($LASTEXITCODE -ne 0) { throw 'send-text.patch failed.' }
          git apply --whitespace=nowarn '.build/scope-parser.patch'
          if ($LASTEXITCODE -ne 0) { throw 'scope-parser.patch failed.' }
          git apply --whitespace=nowarn '.build/update-backend.patch'
          if ($LASTEXITCODE -ne 0) { throw 'update-backend.patch failed.' }
          git apply --whitespace=nowarn '.build/update-ui.patch'
          if ($LASTEXITCODE -ne 0) { throw 'update-ui.patch failed.' }

          $hosted = [IO.File]::ReadAllText('CSharpHost/HostedKickService.cs')
          $backend = [IO.File]::ReadAllText('CSharpHost/BackendHost.cs')
          $main = [IO.File]::ReadAllText('CSharpHost/MainForm.cs')
          $updates = [IO.File]::ReadAllText('CSharpHost/UpdateService.cs')
          $html = [IO.File]::ReadAllText('CSharpHost/web/index.html')
          foreach ($needle in @('JsonValueKind.String','chat:write','SendKickChatAsync','https://sleepysource-api.sleepyservices.workers.dev')) {
            if (-not $hosted.Contains($needle)) { throw "Kick marker missing: $needle" }
          }
          if (-not $backend.Contains('/api/kick/chat/send')) { throw 'Local Kick send route missing.' }
          if (-not $backend.Contains('/api/update/check') -or -not $backend.Contains('/api/update/open-repository')) { throw 'Update routes missing.' }
          if (-not $updates.Contains('https://github.com/SleepyKevy/SleepyChat') -or -not $updates.Contains('/releases/latest')) { throw 'Update repository markers missing.' }
          if (-not $html.Contains('Check for Updates') -or -not $html.Contains('SleepyChat on GitHub') -or -not $html.Contains('checkForUpdates')) { throw 'Update UI missing.' }
          if ($main.Contains('protected override CreateParams') -or $main.Contains('WS_THICKFRAME')) { throw 'Native frame override regression detected.' }

      - name: Validate JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = [IO.File]::ReadAllText('CSharpHost/web/index.html')
          $scripts = [regex]::Matches($html, '(?is)<script(?:\s[^>]*)?>(.*?)</script>')
          $js = Join-Path $env:RUNNER_TEMP 'sleepychat-inline.js'
          [IO.File]::WriteAllText($js, (($scripts | ForEach-Object { $_.Groups[1].Value }) -join "`n"))
          node --check $js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript validation failed.' }

      - name: Generate transparent app icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pillow
          @'
          from pathlib import Path
          from PIL import Image
          root = Path('CSharpHost')
          mark = Image.open(root/'assets'/'theme-blue-raccoon.png').convert('RGBA')
          bbox = mark.getbbox()
          if bbox: mark = mark.crop(bbox)
          scale = min(470/mark.width, 470/mark.height)
          mark = mark.resize((max(1,round(mark.width*scale)),max(1,round(mark.height*scale))),Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA',(512,512),(0,0,0,0))
          canvas.alpha_composite(mark,((512-mark.width)//2,(512-mark.height)//2))
          for s in (64,128,192,256,512): canvas.resize((s,s),Image.Resampling.LANCZOS).save(root/'assets'/f'app-{s}.png')
          canvas.save(root/'assets'/'app.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          canvas.resize((64,64),Image.Resampling.LANCZOS).save(root/'web'/'favicon-64.png')
          canvas.resize((192,192),Image.Resampling.LANCZOS).save(root/'web'/'favicon-192.png')
          canvas.save(root/'web'/'favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          '@ | python -

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore CSharpHost/SleepyChat.csproj -r win-x64
          dotnet publish CSharpHost/SleepyChat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o final-dist
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'final-dist/SleepyChat.exe')) { throw 'Publish failed.' }
          $v = (Get-Item 'final-dist/SleepyChat.exe').VersionInfo
          if ($v.FileVersion -notlike '1.0.0*' -or $v.ProductVersion -notlike '1.0.0*') { throw 'Wrong EXE version.' }

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:17892'
          $proc = Start-Process -FilePath (Resolve-Path 'final-dist/SleepyChat.exe') -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "SleepyChat exited early: $($proc.ExitCode)" }
              try { $s = Invoke-RestMethod "$base/api/status" -TimeoutSec 2; if ($s.version -eq '1.0.0') { $ready=$true; break } } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Backend did not become ready.' }
            $update = Invoke-WebRequest "$base/api/update/check" -TimeoutSec 12 -UseBasicParsing
            if ($update.StatusCode -ne 200) { throw 'Update route failed.' }
            $u = $update.Content | ConvertFrom-Json
            if ($u.current_version -ne '1.0.0') { throw 'Update route reports wrong current version.' }
            if ($u.repository_url -ne 'https://github.com/SleepyKevy/SleepyChat') { throw 'Update route reports wrong repository.' }
            $kick = Invoke-RestMethod "$base/api/kick-config" -TimeoutSec 5
            if ($kick.api_base -ne 'https://sleepysource-api.sleepyservices.workers.dev') { throw 'Wrong Kick API base.' }
            $status = Invoke-WebRequest "$base/api/kick/status" -TimeoutSec 5 -UseBasicParsing
            if ($status.StatusCode -ne 200) { throw 'Kick status failed.' }
            try {
              Invoke-WebRequest "$base/api/kick/chat/send" -Method Post -ContentType 'application/json' -Body '{"content":"smoke"}' -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 400) { throw }
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package verified source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path final-source -Force | Out-Null
          Copy-Item CSharpHost final-source/CSharpHost -Recurse -Force
          foreach ($item in @('README.md','readme.txt','release_notes.txt','BUILD_RELEASE.ps1','.gitignore')) {
            if (Test-Path $item) { Copy-Item $item final-source/$item -Force }
          }

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Update-Checker-Windows-x64-v2
          path: final-dist/
          if-no-files-found: error

      - name: Upload verified source
        uses: actions/upload-artifact@v7
        with:
          name: SleepyChat-1.0.0-Update-Checker-Source-v2
          path: final-source/
          if-no-files-found: error
